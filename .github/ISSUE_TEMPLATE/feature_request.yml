name: Idea or feature request
description: Suggest something Recme should do
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe the situation first (what are you trying to get done?), then your idea.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
    validations:
      required: false
