name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows - headless tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: choco install ffmpeg --no-progress -y
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run test:edit
      - run: npm run test:cli

  macos:
    name: macOS - headless tests (experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: brew install ffmpeg
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # The editor, export and Wi-Fi sharing code is platform independent; this is the first
      # real check of it on a Mac. Screen capture itself still needs a person with a Mac.
      - run: npm run test:edit
      - run: npm run test:cli

  macos-build:
    name: macOS - unsigned build (experimental)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: mkdir -p vendor/ffmpeg
      - run: npm run dist:mac -- --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: recme-macos-unsigned
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: warn
